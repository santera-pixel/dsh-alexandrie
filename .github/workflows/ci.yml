name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild the browser bundle
        run: npm run build

      - name: Bundle is committed up to date
        run: git diff --exit-code -- lib/client.js

      # The suites live on the `dev` branch; `main` ships without tests/.
      - name: Host and model suites
        if: hashFiles('tests/**') != ''
        run: npm test

      - name: DOM end-to-end suite
        if: hashFiles('tests/**') != ''
        run: npm run test:gui

      - name: Published tarball ships no dev-only files
        run: |
          # `npm pack` can print lifecycle banners before the JSON, so parse from the first "[".
          npm pack --dry-run --json --ignore-scripts > pack.raw
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('pack.raw', 'utf8');
            const json = raw.slice(raw.indexOf('['), raw.lastIndexOf(']') + 1);
            const [p] = JSON.parse(json);
            const devOnly = p.files
              .map(f => f.path)
              .filter(f => /^(tests|node_modules)\//.test(f) || /\.tgz$/.test(f));
            if (devOnly.length) {
              console.error('dev-only files leaked into the tarball:', devOnly.join(', '));
              process.exit(1);
            }
            console.log('tarball ok:', p.files.length, 'files, no tests');
          "
          rm pack.raw
