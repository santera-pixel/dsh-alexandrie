# dsh-scriptorium bundle patch: inserts the plugin row into the web profile roster.
# The node half (exports ".") runs in the host process and owns the JSON store plus
# the /dsh-scriptorium HTTP routes; the `dsh.client` declaration in package.json makes
# the browser half (exports "./client") load inside the DSH Web GUI.
- insert:
    - id: dsh-scriptorium
      name: dsh-scriptorium
