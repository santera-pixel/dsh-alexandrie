name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Rebuild the browser bundle
        run: npm run build

      - name: Bundle is committed up to date
        run: git diff --exit-code -- lib/client.js

      - name: Host and model suites
        run: npm test

      - name: DOM end-to-end suite
        run: npm run test:gui
